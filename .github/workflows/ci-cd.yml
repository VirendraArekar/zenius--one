name: Zenius One CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  microservices-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & Test All Microservices
        run: mvn -f services/pom.xml -B verify

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm --prefix frontend ci
      - name: TypeScript & Vite Production Build
        run: npm --prefix frontend run build
      - name: Run Vitest Suite
        run: npm --prefix frontend run test

  docker-build:
    needs: [microservices-verify, frontend-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build Microservice & Frontend Images
        run: docker compose --env-file .env.example build
