services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zenius-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenius_one}
      POSTGRES_USER: ${POSTGRES_USER:-zenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenius_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenius} -d ${POSTGRES_DB:-zenius_one}"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-org-service:
    build:
      context: ./services
      dockerfile: identity-org-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zenius_one}
      POSTGRES_USER: ${POSTGRES_USER:-zenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenius_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  customer-service:
    build:
      context: ./services
      dockerfile: customer-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zenius_one}
      POSTGRES_USER: ${POSTGRES_USER:-zenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenius_dev_password}
    depends_on:
      - identity-org-service
    ports:
      - "8082:8082"

  erp-people-service:
    build:
      context: ./services
      dockerfile: erp-people-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zenius_one}
      POSTGRES_USER: ${POSTGRES_USER:-zenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenius_dev_password}
    depends_on:
      - identity-org-service
    ports:
      - "8083:8083"

  workplace-ai-service:
    build:
      context: ./services
      dockerfile: workplace-ai-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zenius_one}
      POSTGRES_USER: ${POSTGRES_USER:-zenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenius_dev_password}
    depends_on:
      - identity-org-service
    ports:
      - "8084:8084"

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      IDENTITY_ORG_URL: http://identity-org-service:8081
      CUSTOMER_URL: http://customer-service:8082
      ERP_PEOPLE_URL: http://erp-people-service:8083
      WORKPLACE_AI_URL: http://workplace-ai-service:8084
    depends_on:
      - identity-org-service
      - customer-service
      - erp-people-service
      - workplace-ai-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - gateway-service
    ports:
      - "3000:80"

volumes:
  postgres_data:
