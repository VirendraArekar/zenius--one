apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenius-customer-service
  namespace: zenius-one
  labels:
    app: zenius-customer-service
    app.kubernetes.io/part-of: zenius-one-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenius-customer-service
  template:
    metadata:
      labels:
        app: zenius-customer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: customer-service
          image: zenius-one/customer-service:1.0.0-GA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: zenius-config
            - secretRef:
                name: zenius-secrets
          env:
            - name: SERVER_PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: zenius-customer-service
  namespace: zenius-one
  labels:
    app: zenius-customer-service
    app.kubernetes.io/part-of: zenius-one-os
spec:
  selector:
    app: zenius-customer-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenius-customer-service-hpa
  namespace: zenius-one
  labels:
    app: zenius-customer-service
    app.kubernetes.io/part-of: zenius-one-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenius-customer-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

