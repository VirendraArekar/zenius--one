apiVersion: v1
kind: ConfigMap
metadata:
  name: zenius-config
  namespace: zenius-one
  labels:
    app.kubernetes.io/part-of: zenius-one-os
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_HOST: "zenius-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "zenius_one"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,https://app.zeniusone.example"
  ZENIUS_AI_PROVIDER: "local"
  IDENTITY_ORG_URL: "http://zenius-identity-org-service:8081"
  CUSTOMER_URL: "http://zenius-customer-service:8082"
  ERP_PEOPLE_URL: "http://zenius-erp-people-service:8083"
  WORKPLACE_AI_URL: "http://zenius-workplace-ai-service:8084"
---
