apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenius-frontend
  namespace: zenius-one
  labels:
    app: zenius-frontend
    app.kubernetes.io/part-of: zenius-one-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenius-frontend
  template:
    metadata:
      labels:
        app: zenius-frontend
    spec:
      containers:
        - name: frontend
          image: zenius-one/frontend:1.0.0-GA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zenius-frontend
  namespace: zenius-one
  labels:
    app: zenius-frontend
    app.kubernetes.io/part-of: zenius-one-os
spec:
  selector:
    app: zenius-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenius-frontend-hpa
  namespace: zenius-one
  labels:
    app: zenius-frontend
    app.kubernetes.io/part-of: zenius-one-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenius-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zenius-ingress
  namespace: zenius-one
  labels:
    app.kubernetes.io/part-of: zenius-one-os
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  rules:
    - host: app.zeniusone.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: zenius-gateway-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zenius-frontend
                port:
                  number: 80

